[pytest]
# Custom markers let recruiters/reviewers run targeted suites:
#   pytest -m smoke        -> quick critical-path checks
#   pytest -m regression   -> full regression suite
#   pytest -m e2e          -> end-to-end user journeys
markers =
    smoke: Quick sanity checks on the most critical paths.
    regression: Full regression suite.
    e2e: End-to-end user journeys (login -> purchase).
    login: Login functionality tests.

# -ra            : show summary of all test outcomes
# --strict-markers: fail if an unregistered marker is used (keeps suite clean)
addopts = -v -ra --strict-markers

# Live logging during test runs
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
